# sbox-panel Docker Compose deployment
#
# Quick start (from repository root):
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Or from inside deploy/ (or a standalone VPS directory using a prebuilt image):
#   docker compose up -d
#
# Show the generated random secret panel URL after startup:
#   docker exec sbox-panel sbox-panel show-url --data-dir /data
#
# Environment variables (set in your shell or a sibling .env file):
#   SBOX_IMAGE     - Docker image name/tag (default: sbox-panel:latest)
#   SBOX_DATA_DIR  - Persistent data directory inside the container (default: /data).
#                    Stores panel.db, managed sing-box binary (/data/bin/sing-box),
#                    generated configs, and TLS certificates.
#                    If changed from /data, update the container side of the volume mount to match.
#   SBOX_LISTEN    - Panel HTTP/HTTPS listen address (default: 0.0.0.0:18080)
#   TZ             - Timezone for logs and scheduled tasks (e.g. UTC, Asia/Shanghai)

services:
  sbox-panel:
    image: ${SBOX_IMAGE:-sbox-panel:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: sbox-panel
    restart: unless-stopped
    # Host networking allows managed sing-box to bind arbitrary TCP/UDP inbound
    # ports, UDP port-hopping ranges, IPv6, and ACME HTTP-01 port 80 directly.
    network_mode: host
    cap_add:
      - NET_BIND_SERVICE
      # Uncomment NET_ADMIN only if enabling a sing-box TUN inbound:
      # - NET_ADMIN
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    environment:
      # Persistent data directory inside the container (default: /data)
      SBOX_DATA_DIR: ${SBOX_DATA_DIR:-/data}
      # Panel web listener address (default: 0.0.0.0:18080)
      SBOX_LISTEN: ${SBOX_LISTEN:-0.0.0.0:18080}
      # Container timezone (default: UTC)
      TZ: ${TZ:-UTC}
    volumes:
      - ./data:/data
    command:
      - serve
      - --data-dir
      - ${SBOX_DATA_DIR:-/data}
      - --listen
      - ${SBOX_LISTEN:-0.0.0.0:18080}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
